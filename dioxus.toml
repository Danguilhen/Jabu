[application]
name = "jabu"
version = "0.1.0"
description = "Cross-platform XMPP client built with Dioxus and Rust"
authors = ["Your Name <your@email.com>"]
license = "MIT"
repository = "https://github.com/Danguilhen/Jabu"
homepage = "https://jabu.example.com"
categories = ["communication", "xmpp", "chat", "social"]
keywords = ["xmpp", "chat", "messaging", "decentralized", "e2ee"]

[build]
# Web target
[build.web]
target = "wasm32-unknown-unknown"
out_dir = "dist/web"
index_html = "index.html"
assets_dir = "assets"
dev_server_port = 8080
dev_server_proxy = { "/api" = "http://localhost:8081" }

# Desktop target
[build.desktop]
target = "x86_64-unknown-linux-gnu"
out_dir = "dist/desktop"
bundle_identifier = "com.jabu.app"
icon = "assets/icons/icon.png"
macos_bundle = { identifier = "com.jabu.app", category = "public.app-category.social-networking" }
windows_bundle = { publisher = "Jabu", certificate_thumbprint = "" }
linux_bundle = { desktop_entry = true, appimage = true, deb = true, rpm = true }

# Mobile targets
[build.mobile]
target = "aarch64-apple-ios"
out_dir = "dist/mobile/ios"
bundle_identifier = "com.jabu.app"
icon = "assets/icons/icon.png"
provisioning_profile = ""
signing_identity = ""

[build.mobile.android]
target = "aarch64-linux-android"
out_dir = "dist/mobile/android"
bundle_identifier = "com.jabu.app"
icon = "assets/icons/icon.png"
keystore_path = ""
keystore_password = ""
key_alias = ""
key_password = ""

[features]
# Platform-specific features
web = ["dioxus/web", "web-sys", "js-sys", "wasm-bindgen", "wasm-bindgen-futures", "gloo-net", "gloo-timers", "gloo-storage", "gloo-events", "gloo-file", "gloo-utils", "reqwest/web", "gloo-timers/web"]
desktop = ["dioxus/desktop", "wry", "tao", "notify", "notify-debouncer-full", "dirs", "sqlx/sqlite", "rusqlite", "reqwest/default"]
mobile = ["dioxus/mobile", "tauri", "tauri-plugin-notification", "tauri-plugin-store", "tauri-plugin-shell", "tauri-plugin-dialog", "tauri-plugin-fs", "tauri-plugin-opener", "tauri-plugin-clipboard", "tauri-plugin-global-shortcut", "tauri-plugin-positioner", "sqlx/sqlite", "rusqlite", "reqwest/default"]

# Feature flags
e2ee = ["omemo", "signal-protocol", "aes-gcm", "chacha20poly1305", "x25519-dalek", "ed25519-dalek", "hkdf", "sha2", "rand", "getrandom", "zeroize", "secrecy"]
push = ["tauri-plugin-notification", "web-sys/Notification", "web-sys/ServiceWorkerRegistration", "web-sys/PushManager", "web-sys/PushSubscription"]
webrtc = ["web-sys/RtcPeerConnection", "web-sys/RtcDataChannel", "web-sys/RtcSessionDescription", "web-sys/RtcIceCandidate", "async-tungstenite"]
background = ["notify", "notify-debouncer-full", "tokio/signal"]
ffi = ["prose-xmpp/insecure-tcp"]

[dev]
# Development settings
hot_reload = true
hot_reload_interval = 100
hot_patch = true
open_browser = true
log_level = "debug"

[dev.web]
port = 8080
host = "0.0.0.0"
proxy = { "/api" = "http://localhost:8081" }

[dev.desktop]
port = 8081

[release]
# Release settings
strip = true
lto = "thin"
codegen_units = 1
opt_level = 3
panic = "abort"
debug = false
split_debuginfo = "unpacked"

[release.wasm]
opt_level = "z"
lto = true
debug = false

[assets]
include = ["assets/**/*"]
exclude = ["**/*.psd", "**/*.ai", "**/*.sketch", "**/*.figma"]

[tauri]
# Tauri configuration for mobile/desktop
bundle = {
    active = true,
    targets = ["all"],
    icon = ["assets/icons/icon.png", "assets/icons/icon.icns", "assets/icons/icon.ico"],
    resources = ["assets/**/*"],
    copyright = "2024 Jabu Contributors",
    category = "Social Networking",
    short_description = "Cross-platform XMPP client",
    long_description = "A modern, cross-platform XMPP client built with Rust and Dioxus",
    deb = { depends = ["libwebkit2gtk-4.1-0", "libayatana-appindicator3-1", "librsvg2-common"] },
    rpm = { depends = ["webkit2gtk4.1", "libayatana-appindicator-gtk3", "librsvg2"] },
    appimage = { bundle_media_framework = true },
    dmg = { window_size = [800, 600] },
    macos = { frameworks = [], minimum_system_version = "10.15", exception_domain = "" },
    windows = { webview_install_mode = "embedBootstrapper", allow_downgrades = false },
    android = { min_sdk_version = 24, target_sdk_version = 34 },
    ios = { minimum_system_version = "15.0" }
}

security = {
    csp = "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; connect-src 'self' https: wss:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:;"
    freeze_prototype = true
    dangerous_disable_asset_csp_modification = false
}

allowlist = {
    all = false
    shell = { all = false, open = true }
    fs = { all = false, readFile = true, writeFile = true, readDir = true, copyFile = true, createDir = true, removeFile = true, removeDir = true, renameFile = true, exists = true }
    path = { all = false }
    protocol = { all = false, asset = true, assetScope = ["**"] }
    http = { all = true }
    notification = { all = true }
    clipboard = { all = true, readText = true, writeText = true, writeImage = true }
    dialog = { all = true, open = true, save = true, message = true, ask = true, confirm = true }
    globalShortcut = { all = true }
    window = { all = true, close = true, hide = true, show = true, maximize = true, minimize = true, unmaximize = true, unminimize = true, startDragging = true, setTitle = true, setFullscreen = true, setResizable = true, setDecorations = true, setAlwaysOnTop = true, setContentProtected = true, setSize = true, setMinSize = true, setMaxSize = true, setPosition = true, center = true, requestUserAttention = true, setIcon = true, setSkipTaskbar = true, setProgressBar = true, setBadgeLabel = true, setCursorIcon = true, setCursorGrab = true, setCursorVisible = true, setIgnoreCursorEvents = true, setContentProtection = true, setBackgroundColor = true }
}

[mobile]
ios = {
    info_plist = {
        NSAppTransportSecurity = { NSAllowsArbitraryLoads = true }
        NSCameraUsageDescription = "Camera access for video calls and QR code scanning"
        NSMicrophoneUsageDescription = "Microphone access for voice messages and calls"
        NSPhotoLibraryUsageDescription = "Photo library access for sharing images"
        NSContactsUsageDescription = "Contacts access for inviting friends"
        NSBluetoothPeripheralUsageDescription = "Bluetooth for local device discovery"
        NSFaceIDUsageDescription = "Face ID for secure unlock"
        UIBackgroundModes = ["remote-notification", "fetch", "background-processing"]
        ITSAppUsesNonExemptEncryption = false
    }
}

android = {
    manifest = {
        permissions = [
            "INTERNET",
            "ACCESS_NETWORK_STATE",
            "ACCESS_WIFI_STATE",
            "FOREGROUND_SERVICE",
            "FOREGROUND_SERVICE_DATA_SYNC",
            "RECEIVE_BOOT_COMPLETED",
            "WAKE_LOCK",
            "VIBRATE",
            "POST_NOTIFICATIONS",
            "CAMERA",
            "RECORD_AUDIO",
            "READ_EXTERNAL_STORAGE",
            "WRITE_EXTERNAL_STORAGE",
            "READ_CONTACTS",
            "WRITE_CONTACTS",
            "BLUETOOTH",
            "BLUETOOTH_ADMIN",
            "BLUETOOTH_CONNECT",
            "USE_BIOMETRIC",
            "USE_FINGERPRINT"
        ]
        uses_cleartext_traffic = false
        network_security_config = "@xml/network_security_config"
    }
}
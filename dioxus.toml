[application]
name = "jabu"
tailwind_input = "crates/ui/assets/tailwind.css"
tailwind_output = "crates/ui/assets/app.css"

[bundle]
identifier = "app.jabu"
publisher = "Jabu"
category = "Social Networking"
short_description = "Cross-platform XMPP client"
long_description = "A fast, private desktop and mobile XMPP client built with Rust and Dioxus."
copyright = "2024 Jabu Contributors"
external_bin = ["dist/bin/jabu-translate-helper"]

[bundle.windows.nsis]
# Stage with dev/prepare-windows-runtime.ps1 before bundling on Windows.
installer_hooks = "../../dev/windows/nsis-runtime.nsh"

[web.app]
title = "Jabu"

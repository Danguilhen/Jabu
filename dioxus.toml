[application]
name = "jabu"
tailwind_input = "crates/ui/assets/tailwind.css"
tailwind_output = "crates/ui/assets/app.css"

[bundle]
identifier = "app.jabu"
publisher = "Jabu"
category = "Social Networking"
short_description = "Cross-platform XMPP client"
long_description = "A fast, private desktop and mobile XMPP client built with Rust and Dioxus."
copyright = "2024 Jabu Contributors"
external_bin = ["target/jabu/helper/jabu-translate-helper"]

[bundle.windows.nsis]
# Generated by dev/prepare-windows-runtime.ps1 with an absolute runtime path.
installer_hooks = "../../target/jabu/windows-runtime/installer.nsh"

[permissions]
camera = { description = "Take part in video calls" }
microphone = { description = "Join voice and video calls" }
bluetooth = { description = "Use a Bluetooth headset for calls" }

[android.permissions]
"android.permission.MODIFY_AUDIO_SETTINGS" = { description = "Route call audio" }

[web.app]
title = "Jabu"

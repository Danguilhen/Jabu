[package]
name = "host"
version = "0.1.1"
edition = "2021"
description = "Optional public Host for Jabu"
license = "MIT"
repository = "https://github.com/Danguilhen/Jabu"

[lib]
name = "host"
path = "src/lib.rs"

[[bin]]
name = "jabu-host"
path = "src/bin/jabu-host.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
figment = { workspace = true }
jid = { workspace = true }
minidom = { workspace = true }
parking_lot = { workspace = true }
percent-encoding = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
xmpp-core = { path = "../xmpp-core" }
jabu-i18n = { path = "../i18n" }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

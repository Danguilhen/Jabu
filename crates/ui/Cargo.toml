[package]
name = "ui"
version = "0.1.0"
edition = "2021"
description = "UI components for Jabu"
license = "MIT"
repository = "https://github.com/Danguilhen/Jabu"
categories = ["gui", "ui"]
keywords = ["dioxus", "components", "xmpp", "chat"]

[lib]
name = "ui"
path = "src/lib.rs"

[dependencies]
dioxus = { version = "0.6", features = ["signals", "router", "web", "desktop", "mobile"] }
dioxus-core = { version = "0.6" }
dioxus-hooks = { version = "0.6" }
dioxus-router = { version = "0.6" }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
once_cell = { workspace = true }
base64 = { workspace = true }

# XMPP types
xmpp-core = { path = "../xmpp-core" }
storage = { path = "../storage" }

# UI utilities
csscolorparser = { workspace = true }
emoji = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints]
workspace = true

[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "link-arg=--max-memory=4294967296",
    "-C", "link-arg=--initial-memory=16777216",
]
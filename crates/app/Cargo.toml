[package]
name = "app"
version = "0.1.0"
edition = "2021"
description = "Main application entry point for Jabu"
license = "MIT"
repository = "https://github.com/Danguilhen/Jabu"
categories = ["application", "gui"]
keywords = ["xmpp", "chat", "dioxus", "cross-platform"]

[[bin]]
name = "jabu"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
dioxus = { version = "0.7.3", features = ["signals", "router", "web", "desktop", "mobile"] }
dioxus-core = { version = "0.7.3" }
dioxus-hooks = { version = "0.7.3" }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
figment = { workspace = true }
config = { workspace = true }
once_cell = { workspace = true }
cfg-if = { workspace = true }
tokio = { workspace = true, features = ["full"] }
jid = { workspace = true }

# Internal crates
xmpp-core = { path = "../xmpp-core" }
storage = { path = "../storage" }
ui = { path = "../ui" }
platform = { path = "../platform" }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints]
workspace = true
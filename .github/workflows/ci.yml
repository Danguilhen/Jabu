name: CI

on:
  push:
    branches: [main, develop]
    # Tag pushes must be listed explicitly: defining only `branches` makes
    # GitHub skip the workflow for `refs/tags/*`, which would leave the
    # signed release job unreachable.
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libnice-dev libsrtp2-dev \
            libasound2-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets
      - name: Check compile
        run: cargo check --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libnice-dev libsrtp2-dev \
            libasound2-dev
      - name: Run hermetic tests
        run: |
          cargo test --workspace --lib
          cargo test -p xmpp-core --test golden --test malformed

  xmpp-smoke:
    name: XMPP smoke (Prosody)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Install Prosody
        run: |
          sudo apt-get update
          sudo apt-get install -y prosody openssl curl
          prosody --version 2>&1 || true
          # The fixture runs its own instance on 127.0.0.1:5222 with its own
          # config; the packaged service would hold the port and answer instead.
          sudo systemctl stop prosody || true
          sudo systemctl disable prosody || true
      - name: Start fixture
        run: |
          chmod +x prosody/run.sh prosody/stop.sh prosody/generate-certs.sh
          ./prosody/run.sh
      - name: Run smoke tests
        env:
          JABU_TEST_XMPP: "1"
        run: cargo test -p xmpp-core --test prosody_smoke -- --test-threads=1
      - name: Stop fixture
        if: always()
        run: ./prosody/stop.sh || true
      - name: Show Prosody log
        if: failure()
        run: tail -100 prosody/data/prosody.log || true

  build-web:
    name: Build Web (informational)
    runs-on: ubuntu-latest
    # xmpp-core does not compile for wasm yet (aws-lc-sys). Keep the job visible
    # but do not let it gate the release until the web transport lands.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - name: Install dioxus-cli
        run: cargo install dioxus-cli --version 0.7.10 --locked
      - name: Build web
        run: dx bundle --platform web --release
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/web/
          retention-days: 7

  build-desktop:
    name: Build Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libgstreamer1.0-dev libdbus-1-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            libnice-dev libsrtp2-dev libasound2-dev
      - name: Install dioxus-cli
        run: cargo install dioxus-cli --version 0.7.10 --locked
      - name: Build desktop
        run: dx bundle --platform desktop --release
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-build
          path: dist/desktop/
          retention-days: 7

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Android SDK
        # android-actions/setup-android@v3 fails on current runner images
        # (`Failed to find package 'tools'`); the SDK is preinstalled, so use
        # its sdkmanager directly and install the packages we need.
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_NDK_HOME=$SDK/ndk/26.3.11579264"
            echo "ANDROID_NDK_ROOT=$SDK/ndk/26.3.11579264"
          } >> "$GITHUB_ENV"
      - name: Install dioxus-cli
        run: cargo install dioxus-cli --version 0.7.10 --locked
      - name: Build Android
        run: |
          # Set up Android linker paths
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang
          export CARGO_TARGET_I686_LINUX_ANDROID_LINKER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android21-clang
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang
          export CARGO_TARGET_ARM_LINUX_ANDROIDEABI_LINKER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang

          dx build --platform android --package app
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          # Debug APK: signing is not configured here, so this job only proves
          # the Android target compiles. The signed APK comes from
          # build-android-release on a v* tag.
          path: target/dx/jabu/debug/android/app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  build-android-release:
    name: Build signed Android release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_NDK_HOME=$SDK/ndk/26.3.11579264"
            echo "ANDROID_NDK_ROOT=$SDK/ndk/26.3.11579264"
          } >> "$GITHUB_ENV"
      - name: Install dioxus-cli
        run: cargo install dioxus-cli --version 0.7.10 --locked
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not configured" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jabu-release.jks"
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/jabu-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Android versionName must not carry the git tag prefix; the output
          # file is dist/jabu-<version>.apk.
          export VERSION_NAME="${GITHUB_REF_NAME#v}"
          export VERSION_CODE="$GITHUB_RUN_NUMBER"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          bash dev/android/build-release.sh
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/jabu-*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [check, test, build-desktop, build-android, build-android-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # build-web is informational and currently cannot succeed (xmpp-core
          # does not compile for wasm), so it is not attached here.
          files: |
            artifacts/desktop-build/*
            artifacts/android-release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android
      - name: Install system dependencies
        run: |
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y pkg-config libssl-dev libdbus-1-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libnice-dev libsrtp2-dev \
            libasound2-dev cmake clang libclang-dev libvulkan-dev glslc \
            spirv-headers glslang-tools bubblewrap
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets
      - name: Check compile
        run: cargo check --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Install system dependencies
        run: |
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y pkg-config libssl-dev libdbus-1-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libnice-dev libsrtp2-dev \
            libasound2-dev cmake clang libclang-dev libvulkan-dev glslc \
            spirv-headers glslang-tools bubblewrap
      - name: Run hermetic tests
        run: |
          cargo test --workspace --lib
          cargo test -p xmpp-core --test golden --test malformed
      - name: Test the embedded translation backend
        run: cargo test -p jabu-translate --features vulkan --lib
      - name: Build the translation helper
        run: cargo build -p jabu-translate --features vulkan --bin jabu-translate-helper

  xmpp-smoke:
    name: XMPP smoke (Prosody)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Install Prosody
        run: |
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y prosody openssl curl
          prosody --version 2>&1 || true
          # The fixture runs its own instance on 127.0.0.1:5222 with its own
          # config; the packaged service would hold the port and answer instead.
          sudo systemctl stop prosody || true
          sudo systemctl disable prosody || true
      - name: Start fixture
        run: |
          chmod +x prosody/run.sh prosody/stop.sh prosody/generate-certs.sh
          ./prosody/run.sh
      - name: Run smoke tests
        env:
          JABU_TEST_XMPP: "1"
        run: cargo test -p xmpp-core --test prosody_smoke --test multi_account_smoke -- --test-threads=1
      - name: Stop fixture
        if: always()
        run: ./prosody/stop.sh || true
      - name: Show Prosody log
        if: failure()
        run: tail -100 prosody/data/prosody.log || true

  build-web:
    name: Build Web (informational)
    runs-on: ubuntu-latest
    # xmpp-core does not compile for wasm yet (aws-lc-sys), so this job cannot
    # pass today. Run it on demand with the rest of CI instead of turning every
    # push red for a known limitation.
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - name: Install dioxus-cli
        run: cargo install dioxus-cli --version 0.7.10 --locked
      - name: Build web
        run: dx bundle --platform web --release --package app
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/web/
          retention-days: 7

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Android SDK
        # android-actions/setup-android@v3 fails on current runner images
        # (`Failed to find package 'tools'`); the SDK is preinstalled, so use
        # its sdkmanager directly and install the packages we need.
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_NDK_HOME=$SDK/ndk/26.3.11579264"
            echo "ANDROID_NDK_ROOT=$SDK/ndk/26.3.11579264"
          } >> "$GITHUB_ENV"
      - name: Install dioxus-cli
        run: cargo install dioxus-cli --version 0.7.10 --locked
      - name: Build Android
        run: |
          # dx defaults to the host ABI when no device is attached, which would
          # ship an x86_64-only APK; name the phone ABI explicitly.
          # Dioxus defaults to minSdk 28; link against that API level so libc
          # symbols used by sysinfo (getifaddrs, getgrgid_r) resolve.
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang

          dx build --platform android --package app --target aarch64-linux-android
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          # Debug APK: signing is not configured here, so this job only proves
          # the Android target compiles. The signed APK comes from
          # build-android-release on a v* tag.
          path: target/dx/jabu/debug/android/app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7


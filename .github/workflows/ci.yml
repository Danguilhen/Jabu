name: CI

on:
  push:
    branches: [main, develop]
    # Tag pushes must be listed explicitly: defining only `branches` makes
    # GitHub skip the workflow for `refs/tags/*`, which would leave the
    # signed release job unreachable.
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libnice-dev libsrtp2-dev \
            libasound2-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets
      - name: Check compile
        run: cargo check --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libnice-dev libsrtp2-dev \
            libasound2-dev
      - name: Run hermetic tests
        run: |
          cargo test --workspace --lib
          cargo test -p xmpp-core --test golden --test malformed

  xmpp-smoke:
    name: XMPP smoke (Prosody)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Install Prosody
        run: |
          sudo apt-get update
          sudo apt-get install -y prosody openssl curl
          prosody --version 2>&1 || true
          # The fixture runs its own instance on 127.0.0.1:5222 with its own
          # config; the packaged service would hold the port and answer instead.
          sudo systemctl stop prosody || true
          sudo systemctl disable prosody || true
      - name: Start fixture
        run: |
          chmod +x prosody/run.sh prosody/stop.sh prosody/generate-certs.sh
          ./prosody/run.sh
      - name: Run smoke tests
        env:
          JABU_TEST_XMPP: "1"
        run: cargo test -p xmpp-core --test prosody_smoke -- --test-threads=1
      - name: Stop fixture
        if: always()
        run: ./prosody/stop.sh || true
      - name: Show Prosody log
        if: failure()
        run: tail -100 prosody/data/prosody.log || true

  build-web:
    name: Build Web (informational)
    runs-on: ubuntu-latest
    # xmpp-core does not compile for wasm yet (aws-lc-sys). Keep the job visible
    # but do not let it gate the release until the web transport lands.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - name: Install dioxus-cli
        run: cargo install dioxus-cli --version 0.7.10 --locked
      - name: Build web
        run: dx bundle --platform web --release --package app
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/web/
          retention-days: 7

  build-desktop:
    name: Build Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libgstreamer1.0-dev libdbus-1-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            libnice-dev libsrtp2-dev libasound2-dev
      - name: Install dioxus-cli
        run: cargo install dioxus-cli --version 0.7.10 --locked
      - name: Build desktop
        run: dx bundle --platform desktop --release --package app
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-build
          # dx writes bundles under target/dx/<app>/bundle/, not dist/.
          path: target/dx/jabu/bundle/linux/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Android SDK
        # android-actions/setup-android@v3 fails on current runner images
        # (`Failed to find package 'tools'`); the SDK is preinstalled, so use
        # its sdkmanager directly and install the packages we need.
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_NDK_HOME=$SDK/ndk/26.3.11579264"
            echo "ANDROID_NDK_ROOT=$SDK/ndk/26.3.11579264"
          } >> "$GITHUB_ENV"
      - name: Install dioxus-cli
        run: cargo install dioxus-cli --version 0.7.10 --locked
      - name: Build Android
        run: |
          # dx defaults to the host ABI when no device is attached, which would
          # ship an x86_64-only APK; name the phone ABI explicitly.
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang

          dx build --platform android --package app --target aarch64-linux-android
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          # Debug APK: signing is not configured here, so this job only proves
          # the Android target compiles. The signed APK comes from
          # build-android-release on a v* tag.
          path: target/dx/jabu/debug/android/app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Install pkgconf
        # gstreamer-sys resolves its libraries through pkg-config, which the
        # Windows image does not ship. pkg-config-lite splits PKG_CONFIG_PATH
        # on ':' and therefore breaks the `C:\...` drive letter; pkgconf
        # handles Windows paths.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/pkgconf/pkgconf/releases/download/pkgconf-3.0.10/pkgconf-x64-3.0.10.msi"
          $msi = Join-Path $env:RUNNER_TEMP "pkgconf.msi"
          curl.exe --fail --location --retry 5 --silent --show-error --output $msi $url
          if ($LASTEXITCODE -ne 0) { throw "pkgconf download failed" }
          $proc = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "pkgconf install failed (exit $($proc.ExitCode))" }
          $exe = Get-ChildItem "C:\Program Files", "C:\Program Files (x86)" -Recurse -Filter pkgconf.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $exe) { throw "pkgconf.exe not found after install" }
          "PKG_CONFIG=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "pkgconf: $($exe.FullName)"
      - name: Install GStreamer
        # Calls and voice need the GStreamer runtime and its development
        # package at build time. 1.26.x is the release line the gstreamer-rs
        # 0.25 bindings are generated against. The MSIs default to Program
        # Files when run silently, so name the usual location explicitly.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "1.26.11"
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$version/msvc"
          $installDir = "C:\gstreamer\1.0\msvc_x86_64"
          foreach ($pkg in @("gstreamer-1.0-msvc-x86_64-$version", "gstreamer-1.0-devel-msvc-x86_64-$version")) {
            $msi = Join-Path $env:RUNNER_TEMP "$pkg.msi"
            $url = "$base/$pkg.msi"
            # The packages are hundreds of megabytes and the server drops long
            # transfers; resume where the previous attempt stopped.
            $ok = $false
            for ($attempt = 1; $attempt -le 8; $attempt++) {
              curl.exe --fail --location --continue-at - --retry 3 --retry-delay 5 --retry-all-errors --silent --show-error --output $msi $url
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              Write-Host "attempt $attempt for $pkg failed (exit $LASTEXITCODE), resuming"
              Start-Sleep -Seconds 5
            }
            if (-not $ok) { throw "download failed for $pkg" }
            Write-Host "$pkg downloaded: $((Get-Item $msi).Length) bytes"
            $proc = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /norestart INSTALLDIR=`"$installDir`"" -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "msiexec failed for $pkg (exit $($proc.ExitCode))" }
          }
      - name: Locate GStreamer
        # Find the tree by its pkg-config file instead of assuming a path, and
        # fail before the ten-minute dx install if the packages went elsewhere.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bases = @("C:\gstreamer", "C:\Program Files\gstreamer", "C:\Program Files (x86)\gstreamer")
          $pc = Get-ChildItem $bases -Recurse -Filter glib-2.0.pc -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $pc) {
            Write-Host "glib-2.0.pc not found; tree under C:\Program Files\gstreamer:"
            Get-ChildItem "C:\Program Files\gstreamer" -Recurse -Depth 2 -ErrorAction SilentlyContinue |
              Select-Object FullName | Select-Object -First 60
            throw "glib-2.0.pc not found under any GStreamer install"
          }
          $root = $pc.Directory.Parent.Parent.FullName
          "PKG_CONFIG_PATH=$($pc.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GSTREAMER_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "GStreamer root: $root"
          Write-Host "pkgconfig: $($pc.Directory.FullName)"
      - name: Check pkg-config finds GStreamer
        shell: pwsh
        run: |
          & $env:PKG_CONFIG --modversion glib-2.0
          if ($LASTEXITCODE -ne 0) { throw "pkg-config cannot find glib-2.0" }
          & $env:PKG_CONFIG --modversion gstreamer-1.0
          if ($LASTEXITCODE -ne 0) { throw "pkg-config cannot find gstreamer-1.0" }
      - name: Cache dioxus-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/dx.exe
          key: dx-0.7.10-windows
      - name: Install dioxus-cli
        shell: pwsh
        run: |
          if (Test-Path "$env:USERPROFILE\.cargo\bin\dx.exe") {
            Write-Host "dx restored from cache"
          } else {
            cargo install dioxus-cli --version 0.7.10 --locked
          }
      - name: Warm cargo metadata
        # dx aborts if its `cargo metadata` call takes more than ~55s, which it
        # does on a cold Windows runner. Resolving once here keeps dx's call
        # fast.
        run: cargo metadata --format-version 1 | Out-Null
      - name: Compile the Windows binary
        # dx hides cargo's stderr, so build once through cargo to get a
        # readable error when the target does not compile.
        run: cargo build --release --package app --target x86_64-pc-windows-msvc
      - name: Build Windows bundle
        run: dx bundle --platform windows --release --package app --verbose
      - name: List bundle output
        shell: pwsh
        run: Get-ChildItem -Recurse target/dx/jabu/bundle | Select-Object FullName, Length
      - name: Assemble portable build
        # The installer does not carry the GStreamer DLLs, so a machine without
        # GStreamer installed would start the app with calls unavailable.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem -Path target/dx -Recurse -Filter jabu.exe |
            Where-Object { $_.FullName -notmatch '\\build\\' } |
            Select-Object -First 1
          if (-not $exe) { throw "jabu.exe not found under target/dx" }
          $stage = "dist/windows-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe.FullName $stage
          $gst = $env:GSTREAMER_ROOT
          Copy-Item "$gst\bin\*.dll" $stage
          New-Item -ItemType Directory -Force -Path "$stage\lib\gstreamer-1.0" | Out-Null
          Copy-Item "$gst\lib\gstreamer-1.0\*.dll" "$stage\lib\gstreamer-1.0"
          if (Test-Path "$gst\libexec\gstreamer-1.0") {
            New-Item -ItemType Directory -Force -Path "$stage\libexec\gstreamer-1.0" | Out-Null
            Copy-Item "$gst\libexec\gstreamer-1.0\*" "$stage\libexec\gstreamer-1.0"
          }
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "dev" }
          Compress-Archive -Path "$stage\*" -DestinationPath "dist/jabu-$version-windows-x64.zip"
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            target/dx/jabu/bundle/windows/**/*.exe
            target/dx/jabu/bundle/windows/**/*.msi
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows portable
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/jabu-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  build-android-release:
    name: Build signed Android release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_NDK_HOME=$SDK/ndk/26.3.11579264"
            echo "ANDROID_NDK_ROOT=$SDK/ndk/26.3.11579264"
          } >> "$GITHUB_ENV"
      - name: Install dioxus-cli
        run: cargo install dioxus-cli --version 0.7.10 --locked
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not configured" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jabu-release.jks"
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/jabu-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Android versionName must not carry the git tag prefix; the output
          # file is dist/jabu-<version>.apk.
          export VERSION_NAME="${GITHUB_REF_NAME#v}"
          export VERSION_CODE="$GITHUB_RUN_NUMBER"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          bash dev/android/build-release.sh
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/jabu-*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [check, test, build-desktop, build-android, build-windows, build-android-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # build-web is informational and currently cannot succeed (xmpp-core
          # does not compile for wasm), so it is not attached here.
          files: |
            artifacts/desktop-build/*
            artifacts/windows-installer/**
            artifacts/windows-portable/*.zip
            artifacts/android-release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

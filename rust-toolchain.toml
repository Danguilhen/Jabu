[toolchain]
channel = "1.98.1"
components = ["rustfmt", "rust-src"]
targets = [
    "wasm32-unknown-unknown",
    "aarch64-apple-ios",
    "x86_64-apple-ios",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "i686-linux-android",
    "x86_64-linux-android",
]

[profile]
default = "release"